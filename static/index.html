<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GravPool</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <header class="header">
    <div class="header-left">
      <h1 class="logo">GravPool</h1>
      <div id="proxy-status" class="proxy-pill skeleton">
        <span class="status-dot"></span> <span class="status-text">Checking Proxy...</span>
      </div>
    </div>
    <div class="header-right">
      <div class="endpoint-group" id="endpoint-group">
        <code id="proxy-endpoint" class="endpoint-url skeleton-text"></code>
        <button id="copy-key-btn" class="btn btn-icon" aria-label="Copy API Key" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <section class="overview-strip">
      <div class="stats">
        <div class="stat-box">
          <span class="stat-label">Total Accounts</span>
          <span class="stat-value" id="stat-total">-</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">OK</span>
          <span class="stat-value text-green" id="stat-ok">-</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">Expired</span>
          <span class="stat-value text-amber" id="stat-expired">-</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">Disabled</span>
          <span class="stat-value text-gray" id="stat-disabled">-</span>
        </div>
      </div>
      <div class="actions">
        <button id="refresh-all-btn" class="btn">Refresh All</button>
        <button id="reload-quota-btn" class="btn">Reload Quota</button>
        <button id="add-account-btn" class="btn btn-primary">Add Account</button>
      </div>
    </section>

    <div class="grid-layout">
      <!-- Accounts Column -->
      <section class="panel accounts-panel">
        <header class="panel-header">
          <h2>Accounts</h2>
        </header>
        <div id="accounts-container" class="card-list">
          <div class="skeleton-text" style="height: 100px; width: 100%; border-radius: 4px;"></div>
        </div>
      </section>

      <!-- Combos Column -->
      <section class="panel combos-panel">
        <header class="panel-header">
          <h2>Combos</h2>
        </header>
        <div class="combo-create">
          <form id="combo-form" class="combo-form">
            <input type="text" id="combo-name" placeholder="Combo Name" required>
            <select id="combo-kind" required aria-label="Combo Kind">
              <option value="fallback">Fallback</option>
              <option value="fusion">Fusion</option>
            </select>
            <input type="text" id="combo-models" placeholder="Models (comma-separated)" required>
            <button type="submit" class="btn">Create</button>
          </form>
        </div>
        <div id="combos-container" class="card-list">
          <div class="skeleton-text" style="height: 80px; width: 100%; border-radius: 4px;"></div>
        </div>
      </section>
    </div>
  </main>

  <!-- Add Account Panel -->
  <dialog id="add-account-dialog" class="dialog">
    <div class="dialog-content">
      <h2>Add Account</h2>
      <div id="add-account-state" class="add-account-state">
        <button id="start-add-account" class="btn btn-primary w-full">Generate Auth Link</button>
      </div>
      <div class="dialog-actions">
        <button id="close-add-account" class="btn">Close</button>
      </div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
