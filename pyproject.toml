[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gravpool"
version = "0.4.3"
description = "Manage a pool of Google Antigravity accounts: OAuth refresh, live quota, combo routing, and web dashboard"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Omni.labs" }]
keywords = ["antigravity", "gemini", "oauth", "quota", "cliproxyapi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
]

[project.scripts]
gravpool = "gravpool.cli:main"

[tool.setuptools.packages.find]
include = ["gravpool*"]
